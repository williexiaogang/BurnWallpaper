[package]
name = "burn-wallpaper"
version = "0.1.0"
description = "燃 BURN wallpaper app"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
zeroize = "1"
tokio = { version = "1", features = ["time"] }
libc = "0.2"
windows = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["tokio"] }

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["tokio", "gtk3"] }
